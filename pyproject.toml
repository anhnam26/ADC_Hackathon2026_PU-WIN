[project]
name = "handsfree-office-agent"
version = "0.1.0"
description = "Vietnamese voice office assistant with verified Excel reports and approval-gated Gmail"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<0.29",
  "openpyxl>=3.1,<3.2",
  "python-dotenv>=1.1,<2",
  "sounddevice>=0.5,<0.6",
  "pywin32>=311; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

